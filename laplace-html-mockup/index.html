<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111312">
  <title>Laplace — Desktop Workspace Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" aria-label="Application toolbar">
      <div class="topbar-left">
        <div class="traffic-lights" aria-hidden="true"><span></span><span></span><span></span></div>
        <button class="brand" type="button" data-page="overview" aria-label="Laplace home">
          <span class="brand-mark"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" fill="none" stroke="currentColor" stroke-width=".85"/><path d="M12 9v17h15M12 26 25 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/><circle cx="25" cy="10" r="2" fill="currentColor"/></svg></span>
          <span class="brand-word">laplace<span class="brand-point">.</span></span>
        </button>
        <span class="top-separator"></span>
        <button type="button" class="project-select" data-page="overview"><span class="project-avatar">A</span><span>atlas <span class="muted-slash">/</span> api</span><span class="chevron">⌄</span></button>
        <span class="top-separator project-divider"></span>
        <button type="button" class="branch-select" data-toast="Branch switcher is a visual prototype"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v10a4 4 0 0 0 4 4h6M7 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0-12v9"/></svg><span id="top-branch">main</span></button>
      </div>
      <button class="command-search" type="button" id="open-command"><span class="search-icon">⌕</span> Search files, symbols, commands <kbd>⌘ K</kbd></button>
      <div class="topbar-right"><span class="prototype-pill">DESIGN CONCEPT</span><span class="top-separator"></span><button type="button" class="rook-state" data-page="agent"><span class="live-dot"></span> Rook <span class="subtle-text">/ demo</span></button><button type="button" class="top-icon" data-page="settings" aria-label="Open settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M20 12a8.2 8.2 0 0 0-.1-1.2l1.7-1.3-1.7-3-2 .8A8 8 0 0 0 16 6l-.3-2.2h-3.4L12 6a8 8 0 0 0-1.9.9l-2-.8-1.7 3 1.7 1.3A9 9 0 0 0 8 12a9 9 0 0 0 .1 1.2l-1.7 1.3 1.7 3 2-.8c.6.4 1.2.7 1.9.9l.3 2.2h3.4L16 18c.7-.2 1.3-.5 1.9-.9l2 .8 1.7-3-1.7-1.3A8.2 8.2 0 0 0 20 12Z" transform="translate(-2 0)"/></svg></button></div>
    </header>
    <div class="body-shell">
      <nav class="nav-rail" aria-label="Primary navigation">
        <div class="rail-main">
          <button type="button" class="rail-item" data-page="overview" aria-label="Overview" title="Overview"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 10h16M10 10v10"/></svg><span>Home</span></button>
          <button type="button" class="rail-item active" data-page="editor" aria-label="Editor" title="Editor"><svg viewBox="0 0 24 24"><path d="M8 5 3 12l5 7M16 5l5 7-5 7M14 3l-4 18"/></svg><span>Editor</span></button>
          <button type="button" class="rail-item" data-page="changes" aria-label="Changes" title="Changes"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 11 3 3 5-5M8 18h8"/></svg><span>Changes</span><i class="rail-notify"></i></button>
          <button type="button" class="rail-item" data-page="context" aria-label="Context Lens" title="Context Lens"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="10" cy="18" r="2"/><path d="m8 7 8 1M7 8l2 8m3 1 5-7"/></svg><span>Context</span></button>
          <button type="button" class="rail-item" data-page="verify" aria-label="Verification" title="Verification"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 4.7 3.4 7.4 8 9 4.6-1.6 8-4.3 8-9V7l-8-4Z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg><span>Verify</span></button>
          <div class="rail-divider"></div>
          <button type="button" class="rail-item" data-page="agent" aria-label="Rook agent" title="Rook"><svg viewBox="0 0 24 24"><path d="M4 19V6l8-3 8 3v13l-8 3-8-3ZM4 6l8 4 8-4M12 10v12"/></svg><span>Rook</span></button>
          <button type="button" class="rail-item" data-page="capabilities" aria-label="Skills and MCP" title="Skills and MCP"><svg viewBox="0 0 24 24"><path d="M5 9h6V3h4v6h4v6h-4v6h-4v-6H5V9Z"/></svg><span>Tools</span></button>
        </div>
        <div class="rail-bottom"><button type="button" class="rail-item" data-page="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.5 1.5m8.4 8.4 1.5 1.5m0-11.4-1.5 1.5M7.8 16.2l-1.5 1.5"/></svg><span>Settings</span></button><div class="rail-initials" aria-label="Profile">W</div></div>
      </nav>
      <main id="screen" class="screen" tabindex="-1" aria-label="Laplace screen"></main>
    </div>
    <footer class="statusbar"><div class="status-left"><span class="status-brass">◈</span> <span id="status-workspace">PRIMARY WORKSPACE</span><span class="status-divider"></span><span>TypeScript</span><span class="status-divider"></span><span>UTF-8</span><span class="status-divider"></span><span id="status-position">Ln 18, Col 12</span></div><div class="status-right"><span><span class="live-dot small"></span> Rook / demo</span><span class="status-divider"></span><span>Local-first</span><span class="status-divider"></span><span>Laplace / concept v0.1</span></div></footer>
  </div>
  <div class="palette-backdrop" id="palette-backdrop" hidden><section class="command-palette" role="dialog" aria-label="Command palette" aria-modal="true"><div class="palette-input-wrap"><span>⌕</span><input id="palette-input" aria-label="Search screens and files" placeholder="Where would you like to go?" autocomplete="off"><kbd>ESC</kbd></div><div class="palette-results" id="palette-results"></div><div class="palette-foot"> <span>↵ Open</span><span>↑ ↓ Navigate</span><span>Esc Dismiss</span></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
