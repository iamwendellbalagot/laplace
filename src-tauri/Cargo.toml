[package]
name = "laplace"
version = "0.1.0"
description = "A local-first desktop workspace for software changes"
authors = ["Wendell Balagot"]
edition = "2021"
publish = false

[lib]
name = "laplace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "laplace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", features = [] }
